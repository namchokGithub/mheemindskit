<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MindsKit — simple tools for everyday development. Format, minify, and validate JSON and XML entirely in your browser." />
    <title>MindsKit</title>
    <script>
      try {
        var CONCRETE = ["pearl-light", "midnight-violet", "aurora-blue", "cyber-rose", "mint-frost", "amber-dawn"];
        var DARK = ["midnight-violet", "aurora-blue", "cyber-rose"];
        var stored = localStorage.getItem("mindskit:theme");
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme =
          stored && CONCRETE.indexOf(stored) !== -1
            ? stored
            : systemDark
              ? "midnight-violet"
              : "pearl-light";
        document.documentElement.dataset.theme = theme;
        if (DARK.indexOf(theme) !== -1) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
